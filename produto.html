<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Produto | NEXBYTE</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <a href="index.html" class="logo">
        NEXBYTE
        <span class="logo-sub">TECH STORE</span>
      </a>
      <nav class="nav">
        <a href="index.html">Início</a>
        <a href="catalogo.html">Catálogo</a>
        <a href="sobre.html">Sobre</a>
      </nav>
      <div class="header-actions">
        <a href="login.html" class="btn" data-auth-guest style="font-size:0.875rem;font-weight:500">Entrar</a>
        <span data-auth-user class="hidden" style="font-size:0.875rem">
          Olá, <strong data-user-name></strong>
          <button onclick="logout()" style="background:none;border:none;color:var(--accent);cursor:pointer;margin-left:0.5rem;font-size:0.85rem">Sair</button>
        </span>
        <a href="carrinho.html" class="btn cart-btn">
          🛒 Carrinho
          <span class="cart-count" data-cart-count style="display:none">0</span>
        </a>
      </div>
    </div>
  </header>

  <main>
    <div class="container product-detail" id="product-content">
      <p style="grid-column:1/-1">Carregando...</p>
    </div>
  </main>

  <footer class="footer">
    <div class="footer-grid">
      <div>
        <div class="logo" style="color:var(--bg)">NEXBYTE</div>
      </div>
      <div>
        <h4>Navegação</h4>
        <p><a href="index.html">Início</a></p>
        <p><a href="catalogo.html">Catálogo</a></p>
      </div>
      <div>
        <h4>Atendimento</h4>
        <p style="font-size:0.9rem;opacity:0.8">WhatsApp: (11) 99999-9999</p>
      </div>
      <div>
        <h4>Sobre</h4>
        <p style="font-size:0.9rem;opacity:0.7">Loja demonstrativa · Estoque de preview</p>
      </div>
    </div>
    <div class="footer-bottom">© 2026 NEXBYTE</div>
  </footer>

  <script src="js/store-config.js"></script>
  <script src="js/products.js"></script>
  <script src="js/app.js"></script>
  <script>
    let qty = 1;
    const params = new URLSearchParams(window.location.search);
    const id = params.get("id");
    const product = getProductById(id);

    function changeQty(delta) {
      qty = Math.max(1, qty + delta);
      document.getElementById("qty-value").textContent = qty;
    }

    function handleAdd() {
      if (addToCart(product.id, qty)) {
        const msg = document.getElementById("added-msg");
        msg.classList.remove("hidden");
        setTimeout(() => msg.classList.add("hidden"), 2500);
      }
    }

    document.addEventListener("DOMContentLoaded", () => {
      const el = document.getElementById("product-content");
      if (!product) {
        el.innerHTML = `
          <div style="grid-column:1/-1;text-align:center;padding:3rem 0">
            <h1 class="section-title">Produto não encontrado</h1>
            <a href="catalogo.html" class="back-link mt-4">← Voltar ao catálogo</a>
          </div>`;
        return;
      }

      document.title = product.name + " | NEXBYTE";

      el.innerHTML = `
        <div style="grid-column:1/-1">
          <a href="catalogo.html" class="back-link">← Voltar ao catálogo</a>
        </div>
        <div class="gallery">
          <img src="${product.image}" alt="${product.name}" />
        </div>
        <div class="info">
          <p class="category">${product.category}</p>
          <h1>${product.name}</h1>
          <p style="color:var(--stone)">Marca: ${product.brand || "NEXBYTE"}</p>
          <div style="margin:1.25rem 0">
            ${product.originalPrice ? `<span class="price-old">${formatPrice(product.originalPrice)}</span>` : ""}
            <span class="price" style="font-size:1.75rem">${formatPrice(product.price)}</span>
          </div>
          <p style="color:var(--stone);line-height:1.6">${product.description}</p>
          ${product.specs ? `<div class="spec-list"><div style="padding:.8rem .9rem;font-weight:700;background:rgba(56,189,248,.08)">Especificações</div>${Object.entries(product.specs).map(([key,value]) => `<div class="spec-row"><span>${key}</span><strong>${value}</strong></div>`).join("")}</div>` : ""}
          <div style="display:flex;flex-wrap:wrap;align-items:center;gap:1rem;margin-top:1.75rem">
            <div class="qty-control">
              <button type="button" onclick="changeQty(-1)">−</button>
              <span id="qty-value">1</span>
              <button type="button" onclick="changeQty(1)">+</button>
            </div>
            <button class="btn btn-dark" onclick="handleAdd()" id="add-btn">
              ${getUser() ? "Adicionar ao carrinho" : "Entrar para adicionar"}
            </button>
          </div>
          <p id="added-msg" class="hidden" style="margin-top:0.75rem;color:#15803d;font-weight:500">✓ Adicionado ao carrinho!</p>
          <p style="margin-top:1.25rem;font-size:0.85rem;color:var(--stone)">Estoque de preview: ${product.stock} unidades · quantidade fictícia</p>
        </div>
      `;
    });
  </script>
</body>
</html>
