<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Carrinho | NEXBYTE</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <a href="index.html" class="logo">
        NEXBYTE
        <span class="logo-sub">TECH STORE</span>
      </a>
      <nav class="nav">
        <a href="index.html">Início</a>
        <a href="catalogo.html">Catálogo</a>
        <a href="sobre.html">Sobre</a>
      </nav>
      <div class="header-actions">
        <span data-auth-user class="hidden" style="font-size:0.875rem">
          Olá, <strong data-user-name></strong>
          <button onclick="logout()" style="background:none;border:none;color:var(--accent);cursor:pointer;margin-left:0.5rem;font-size:0.85rem">Sair</button>
        </span>
        <a href="carrinho.html" class="btn cart-btn">
          🛒 Carrinho
          <span class="cart-count" data-cart-count style="display:none">0</span>
        </a>
      </div>
    </div>
  </header>

  <main>
    <div class="container" id="cart-root" style="padding:2.5rem 0">
      <p>Carregando...</p>
    </div>
  </main>

  <footer class="footer">
    <div class="footer-bottom" style="border:none">© 2026 NEXBYTE</div>
  </footer>

  <script src="js/store-config.js"></script>
  <script src="js/products.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      if (!requireAuth("carrinho.html")) return;

      renderCart();
    });

    function renderCart() {
      const root = document.getElementById("cart-root");
      const cart = getCart();
      const user = getUser();

      if (cart.length === 0) {
        root.innerHTML = `
          <div class="text-center" style="padding:3rem 0">
            <h1 class="section-title">Seu carrinho</h1>
            <p style="color:var(--stone);margin:1rem 0 1.5rem">O carrinho está vazio.</p>
            <a href="catalogo.html" class="btn btn-dark">Ir ao catálogo</a>
          </div>`;
        return;
      }

      const itemsHtml = cart.map(item => {
        const p = getProductById(item.id);
        if (!p) return "";
        return `
          <div class="cart-item">
            <img src="${p.image}" alt="${p.name}" />
            <div style="flex:1;display:flex;flex-direction:column">
              <div style="display:flex;justify-content:space-between;gap:0.5rem">
                <div>
                  <a href="produto.html?id=${p.id}" style="font-weight:500">${p.name}</a>
                  <p style="font-size:0.85rem;color:var(--stone)">${p.category}</p>
                </div>
                <button onclick="removeFromCart('${p.id}'); renderCart()" style="background:none;border:none;color:var(--stone);cursor:pointer;font-size:0.85rem">Remover</button>
              </div>
              <div style="margin-top:auto;display:flex;align-items:center;justify-content:space-between;padding-top:0.75rem">
                <div class="qty-control">
                  <button type="button" onclick="updateQuantity('${p.id}', ${item.quantity - 1}); renderCart()">−</button>
                  <span>${item.quantity}</span>
                  <button type="button" onclick="updateQuantity('${p.id}', ${item.quantity + 1}); renderCart()">+</button>
                </div>
                <span style="font-weight:600">${formatPrice(p.price * item.quantity)}</span>
              </div>
            </div>
          </div>`;
      }).join("");

      root.innerHTML = `
        <h1 class="section-title">Seu carrinho</h1>
        <p style="font-size:0.85rem;color:var(--stone);margin-bottom:1.5rem">
          Logado como ${user.name} (${user.email})
        </p>
        <div class="cart-layout">
          <div style="display:flex;flex-direction:column;gap:1rem">
            ${itemsHtml}
          </div>
          <div class="cart-summary">
            <h2 style="font-weight:500;margin-bottom:1rem">Resumo</h2>
            <div class="row">
              <span style="color:var(--stone)">Subtotal</span>
              <span>${formatPrice(cartTotalPrice())}</span>
            </div>
            <div class="row">
              <span style="color:var(--stone)">Frete</span>
              <span style="color:var(--stone)">A calcular</span>
            </div>
            <div class="row total">
              <span>Total</span>
              <span>${formatPrice(cartTotalPrice())}</span>
            </div>
            <button class="btn" style="width:100%;margin-top:1.25rem;background:#d6d3d1;color:#57534e;cursor:not-allowed" disabled>
              Finalizar compra (em breve)
            </button>
            <p style="text-align:center;font-size:0.75rem;color:var(--stone);margin-top:0.75rem">
              Integração de pagamento será adicionada depois
            </p>
            <button onclick="clearCart(); renderCart()" style="display:block;width:100%;margin-top:1rem;background:none;border:none;color:var(--stone);cursor:pointer;font-size:0.85rem">
              Limpar carrinho
            </button>
          </div>
        </div>`;
    }
  </script>
</body>
</html>
